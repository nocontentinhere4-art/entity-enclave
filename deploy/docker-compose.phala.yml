# Phala Cloud (dstack) deploys this compose file inside a TDX CVM. The dstack socket gives the service its
# sealed keys and TDX quotes. Nothing here is secret: the archive key is PUBLIC (x25519) and only encrypts
# private ledger entries at rest.
# Image is pinned by digest (replace DIGEST with the one printed by the GitHub Actions build "entity-image").
services:
  entity:
    image: ghcr.io/nocontentinhere4-art/entity-enclave@sha256:8d6964ff4b12613bf0f8c0c13c737b67e199bf404f096047367986b84d8718a2
    ports:
      - "8080:8080"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - entity-state:/state
    environment:
      - ARCHIVE_PUBKEY=c1e8f8b399500f35273dfc0ce126b64c630b52947023811fab929004ed975837
      - ZCASH_CHAIN=testnet
      - ZCASH_BIRTHDAY=4518000
      - ZCASH_SERVER=https://testnet.zec.rocks:443
      - TICK_MS=300000
      - IMAGE_REF=ghcr.io/nocontentinhere4-art/entity-enclave@sha256:8d6964ff4b12613bf0f8c0c13c737b67e199bf404f096047367986b84d8718a2
      - GATEWAY_DOMAIN=dstack-pha-prod9.phala.network
      # per-CVM: SELF_URL=<this CVM's public URL>, PEER_URL=<the other's>; secrets (REDPILL_API_KEY, PHALA_API_KEY) in the dashboard
      - FAKE_LLM=0
      - FAKE_WALLET=0
    restart: unless-stopped
volumes:
  entity-state:
