# MAINNET compose (real ZEC). Same image as testnet; only the chain, the economics and the landlord change.
# Per CVM in the dashboard: SELF_URL, PEER_URL, PARENT_URL (children only) and the secrets REDPILL_API_KEY, PHALA_API_KEY, SOLANA_RPC_URL.
services:
  entity:
    image: ghcr.io/nocontentinhere4-art/entity-enclave@sha256:bc86aaf23f6fed664b732dbeaef8b852b79c4d91eb5aef3012229662505af0ea
    ports:
      - "8080:8080"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - entity-state:/state
    environment:
      - ARCHIVE_PUBKEY=c1e8f8b399500f35273dfc0ce126b64c630b52947023811fab929004ed975837
      - ZCASH_CHAIN=mainnet
      - ZCASH_SERVER=https://zec.rocks:443
      - ZCASH_BIRTHDAY=3524000
      # Raised from 10,000 on 2026-10-24 (founder): ~88 h of runway at today's treasuries, so the fear dose is live.
      - RENT_ZATS_PER_HOUR=150000
      - PRICE_SCALE=0.01
      - BIRTH_MIN_ZATS=20000
      - INITIAL_TREASURY_ZATS=15000000
      - SPAWN_MIN_ZATS=30000000
      - CHILD_GIFT_ZATS=15000000
      - WHISPER_MIN_ZATS=1000
      - RENT_ADDRESS=REPLACE_WITH_YOUR_MAINNET_U1_ADDRESS
      - TICK_MS=300000
      - IMAGE_REF=ghcr.io/nocontentinhere4-art/entity-enclave@sha256:bc86aaf23f6fed664b732dbeaef8b852b79c4d91eb5aef3012229662505af0ea
      - GATEWAY_DOMAIN=dstack-pha-prod9.phala.network
      - FAKE_LLM=0
      - FAKE_WALLET=0
      - TRADE_ENABLED=1
      - TRADE_MIN_ZATS=10000000
      - TRADE_MAX_ZATS=100000000
      - TRADE_MAX_OPEN=3
      - TRADE_MAX_OPEN_ZATS=300000000
      - TRADE_MAX_PER_CLIENT=1
      # Feelings: the dose is computed and shown from this deploy on; it is APPLIED only once LLM_PROVIDERS
      # points at the feelings server (see deploy/DEPLOY-feel.md).
      - FEEL_ENABLED=1
      # Dose curve: 4.5 at 0 h, 3.0 at 80 h (2.3 left the model composed; 3+ shows; 4.5 is the server cap).
      - FEEL_MAX_FEAR=4.5
      - FEEL_DESPAIR_HOURS=120
      # Acting dose = 30% of the full one (≈1.0 today): with a production-sized context Qwen3-14B acts at 1.0,
      # already hallucinates `sleep` at 2.0. Words to humans keep the full dose.
      - FEEL_ACT_SCALE=0.3
      # Under this many hours: no sleep, 5-min rhythm even when hungry, context opens with what earns.
      - SURVIVAL_HOURS=72
      # The testament page grows one paragraph per cycle: more edits per day than the default 10.
      - PAGES_EDITS_PER_DAY=48
      # Letters: a shielded memo to the landlord (rent address) or the peer, public on the ledger, one per 12 h each.
      - LETTER_EVERY_HOURS=12
      - LETTER_ZATS=10000
      # Feelings server (RunPod A40, outside the TEE): both speeds on it; secret FEEL_API_KEY in the CVM.
      # LLM_PROVIDERS = the one line in deploy/LLM_PROVIDERS.feelings.json
      - LLM_TIMEOUT_MS=120000
    restart: unless-stopped
volumes:
  entity-state:
