# Builds the feelings server image (steered Qwen3-14B inference, feelings/Dockerfile) on amd64 and publishes it
# to GHCR with a public digest, same pattern as image.yml. Copy to .github/workflows/ in the public repo.
name: feelings-image
on:
  push:
    branches: [main]
    paths: ["feelings/**", ".github/workflows/feelings-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: feelings
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/entity-enclave-feelings:latest
            ghcr.io/${{ github.repository_owner }}/entity-enclave-feelings:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          echo "IMAGE DIGEST: ${{ steps.build.outputs.digest }}"
          echo "ghcr.io/${{ github.repository_owner }}/entity-enclave-feelings@${{ steps.build.outputs.digest }}" > digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: feelings-digest
          path: digest.txt
